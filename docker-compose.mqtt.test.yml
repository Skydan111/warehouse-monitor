# Eigener Broker nur für automatisierte Tests.
# Anderer Port und anderer Containername: Tests stoppen den Produktiv-Broker nicht.
# Gleiche Konfiguration und ACL wie im Betrieb, Passwortdatei erzeugt der Test.
services:
  mqtt-broker-test:
    image: eclipse-mosquitto:2.0.18
    container_name: warehouse-mqtt-broker-test
    ports:
      - "18830:1883"
    volumes:
      - ./configs/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./configs/mosquitto/acl:/mosquitto/config/acl:ro
      - ./tests/.mqtt-test/passwd:/mosquitto/config/passwd:ro
