<!doctype html>

<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warehouse Monitor</title>
    <link rel="icon" href="data:," />
    <!-- Alle Ressourcen lokal (vendor/): keine Anfragen an externe Server -->
    <link rel="stylesheet" href="style.css" />
    <script src="vendor/chartjs/chart.umd.min.js"></script>
  </head>
  <body>
    <div class="layout">
      <header>
        <div class="header-left">
          <h1>Warehouse Monitor</h1>
          <p id="last-update">Warte auf Daten…</p>
        </div>

        <div class="header-status">
          <div class="status-date" id="current-date">—</div>

          <div class="status-time" id="current-time">—</div>

          <div class="live-badge">
            <div class="live-dot"></div>
            LIVE
          </div>
        </div>
      </header>

      <!-- AKTUELLE WERTE -->

      <div class="metrics-row">
        <div class="metric-card temp">
          <div class="metric-label">Temperatur</div>
          <div class="metric-value">
            <span id="val-temp">—</span><span class="metric-unit">°C</span>
          </div>
          <div class="metric-status" id="status-temp">—</div>
          <div class="metric-stats" id="stats-temp">—</div>
        </div>
        <div class="metric-card hum">
          <div class="metric-label">Luftfeuchtigkeit</div>
          <div class="metric-value">
            <span id="val-hum">—</span><span class="metric-unit">%</span>
          </div>
          <div class="metric-status" id="status-hum">—</div>
          <div class="metric-stats" id="stats-hum">—</div>
        </div>
        <div class="metric-card press">
          <div class="metric-label">Luftdruck</div>
          <div class="metric-value">
            <span id="val-press">—</span><span class="metric-unit">hPa</span>
          </div>
          <div class="metric-status" id="status-press">—</div>
          <div class="metric-stats" id="stats-press">—</div>
        </div>
      </div>

      <!-- DIAGRAMME -->

      <div class="charts-row">
        <div class="chart-card">
          <div class="chart-title">Temperatur / °C</div>
          <div class="chart-canvas-wrap">
            <canvas id="chart-temp"></canvas>
          </div>
        </div>
        <div class="chart-card">
          <div class="chart-title">Luftfeuchtigkeit / %</div>
          <div class="chart-canvas-wrap">
            <canvas id="chart-hum"></canvas>
          </div>
        </div>
        <div class="chart-card">
          <div class="chart-title">Luftdruck / hPa</div>
          <div class="chart-canvas-wrap">
            <canvas id="chart-press"></canvas>
          </div>
        </div>
      </div>

      <!-- GRENZWERTVERLETZUNGEN -->

      <div class="alerts-section">
        <div class="section-title">Grenzwertverletzungen</div>
        <div id="alerts-list">
          <div class="no-alerts">Warte auf Daten…</div>
        </div>
      </div>

      <!-- KI-ANALYSE -->

      <div class="ai-section">
        <div class="ai-left">
          <div class="section-title">KI-Analyse</div>
          <button id="ai-btn">Analysieren</button>
        </div>
        <div class="ai-divider"></div>
        <div id="ai-output">
          „Analysieren“ erstellt einen KI-Bericht zu den aktuellen Messdaten.
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
