# Mosquitto 2.0.18 – Broker des Warehouse Monitor (Docker)
#
# Anmeldung mit Benutzer und Passwort, Rechte über Zugriffsliste (ACL).
# Kein TLS: Passwörter und Messwerte gehen im Klartext über das Netz
# (siehe Projektdokumentation, Kapitel 4.4).

listener 1883 0.0.0.0

allow_anonymous false

# Gehashte Passwörter; Datei ist lokal und von Git ausgeschlossen.
# Erzeugen mit scripts/mqtt_provision.sh
password_file /mosquitto/config/passwd

# Rechte je Benutzer (versioniert, enthält keine Geheimnisse)
acl_file /mosquitto/config/acl
